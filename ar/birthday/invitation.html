<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arthur is turning three!</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
}
#container{
  width:100vw;
  height:100vh;
  position:fixed;
  inset:0;
  background:#000;
}

/* Start overlay */
#startOverlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,0.86);
  color:#fff;
  text-align:center;
  padding:24px;
}
#startPanel{
  max-width:420px;
}
#startPanel h1{
  margin:0 0 12px;
  font-size:28px;
  line-height:1.1;
}
#startPanel p{
  margin:0 0 22px;
  font-size:16px;
  line-height:1.45;
  opacity:0.9;
}
#startButton{
  appearance:none;
  border:0;
  border-radius:999px;
  padding:14px 22px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

/* Hidden during normal use, visible only for errors */
#status{
  display:none;
  position:fixed;
  left:12px;
  right:12px;
  top:12px;
  z-index:999;
  color:#fff;
  background:rgba(0,0,0,.72);
  border-radius:12px;
  padding:10px;
  font-size:14px;
  line-height:1.35;
  white-space:pre-wrap;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>

<body>
<div id="container"></div>

<div id="startOverlay">
  <div id="startPanel">
    <h1>Arthur is turning three!</h1>
    <p>Point your camera at the invite to reveal the magic.</p>
    <button id="startButton">Tap to start the magic</button>
  </div>
</div>

<div id="status"></div>

<script type="module">
import * as THREE from 'three';

const CONFIG = {
  targetSrc: './targets.mind',
  posterImage: './assets/poster-opening-frame_v01.png',
  videoSrc: './assets/animation_v01.mp4',

  posterWidth: 1,
  posterHeight: 1.414,

  videoCanvasWidth: 1748,
  videoCanvasHeight: 2480,
  videoPosterWidth: 1748,
  videoPosterHeight: 2480,
  videoPosterCenterX: 0.5,
  videoPosterCenterY: 0.5
};

function getVideoPlaneTransform() {
  const width = CONFIG.posterWidth * (CONFIG.videoCanvasWidth / CONFIG.videoPosterWidth);
  const height = CONFIG.posterHeight * (CONFIG.videoCanvasHeight / CONFIG.videoPosterHeight);
  const x = -(CONFIG.videoPosterCenterX - 0.5) * width;
  const y = (CONFIG.videoPosterCenterY - 0.5) * height;
  return { width, height, x, y };
}

function setStatus(message, showToUser = false) {
  const status = document.getElementById('status');
  status.textContent = message;
  console.log(message);

  if (showToUser) {
    status.style.display = 'block';
  }
}

function showError(message) {
  setStatus(message, true);
}

function errorToString(err) {
  try {
    return JSON.stringify({
      name: err?.name,
      message: err?.message,
      stack: err?.stack,
      string: String(err),
      keys: err && typeof err === 'object' ? Object.keys(err) : []
    }, null, 2);
  } catch (e) {
    return String(err);
  }
}

async function checkFiles() {
  const checks = [CONFIG.targetSrc, CONFIG.posterImage, CONFIG.videoSrc];

  for (const url of checks) {
    const res = await fetch(url, { cache: 'no-store' });
    const blob = await res.blob();

    if (!res.ok) throw new Error(`Missing/unreachable: ${url} (${res.status})`);
    if (url.endsWith('.mind') && blob.size < 100) throw new Error('targets.mind looks empty/invalid.');

    console.log(url, blob.size);
  }
}

async function createMindAR() {
  const { MindARThree } = await import('mindar-image-three');
  return new MindARThree({
    container: document.getElementById('container'),
    imageTargetSrc: CONFIG.targetSrc,
    maxTrack: 1,
    filterMinCF: 0.005,
    filterBeta: 0.05
  });
}

function makeVideoElement(src) {
  const video = document.createElement('video');
  video.src = src;
  video.crossOrigin = 'anonymous';
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.muted = true;
  video.defaultMuted = true;
  video.loop = true;
  video.preload = 'auto';
  video.autoplay = false;
  video.style.display = 'none';
  document.body.appendChild(video);
  return video;
}

async function primeVideo(video) {
  try {
    await video.play();
    video.pause();
    video.currentTime = 0;
  } catch (err) {
    console.warn('Video priming failed:', err);
  }
}

function loadTexture(url) {
  return new Promise((resolve, reject) => {
    new THREE.TextureLoader().load(
      url,
      texture => {
        texture.colorSpace = THREE.SRGBColorSpace;
        resolve(texture);
      },
      undefined,
      () => reject(new Error('Texture failed: ' + url))
    );
  });
}

let posterMesh;
let videoMesh;
let video;
let hasStartedOnce = false;
let isInitialised = false;

async function playExperience() {
  if (!video || !videoMesh || !posterMesh) return;

  posterMesh.visible = false;
  videoMesh.visible = true;

  if (!hasStartedOnce) {
    video.currentTime = 0;
    hasStartedOnce = true;
  }

  try {
    await video.play();
    setStatus('Target found — looping video.');
  } catch (err) {
    console.warn('Video play failed:', err);
    showError('Video play failed. Please tap the screen once, then point at the invite again.');
  }
}

async function initialise() {
  if (isInitialised) return;
  isInitialised = true;

  try {
    setStatus('Checking files…');
    await checkFiles();

    setStatus('Preparing video…');
    video = makeVideoElement(CONFIG.videoSrc);
    await primeVideo(video);

    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;
    videoTexture.needsUpdate = true;

    setStatus('Initialising AR…');
    const mindarThree = await createMindAR();
    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    const posterTexture = await loadTexture(CONFIG.posterImage);
    posterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(CONFIG.posterWidth, CONFIG.posterHeight),
      new THREE.MeshBasicMaterial({
        map: posterTexture,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.DoubleSide
      })
    );
    anchor.group.add(posterMesh);

    const videoTransform = getVideoPlaneTransform();
    videoMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(videoTransform.width, videoTransform.height),
      new THREE.MeshBasicMaterial({
        map: videoTexture,
        transparent: true,
        opacity: 1,
        alphaTest: 0.001,
        depthWrite: false,
        depthTest: true,
        blending: THREE.NormalBlending,
        side: THREE.DoubleSide,
        toneMapped: false
      })
    );
    videoMesh.position.set(videoTransform.x, videoTransform.y, 0.01);
    videoMesh.visible = false;
    anchor.group.add(videoMesh);

    anchor.onTargetFound = () => {
      playExperience();
    };

    anchor.onTargetLost = () => {
      if (videoMesh) videoMesh.visible = false;
      if (posterMesh) posterMesh.visible = true;
      setStatus('Target lost.');
    };

    setStatus('Starting camera…');
    await mindarThree.start();

    setStatus('Camera started. Looking for target.');
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  } catch (err) {
    console.error(err);
    showError('AR failed to start: ' + errorToString(err));
    document.getElementById('startOverlay').style.display = 'grid';
    isInitialised = false;
  }
}

document.getElementById('startButton').addEventListener('click', async () => {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('status').style.display = 'none';
  await initialise();
});

window.addEventListener('error', e => {
  console.error(e);
  showError('Runtime error: ' + e.message);
});

window.addEventListener('unhandledrejection', e => {
  console.error(e);
  showError('Promise error: ' + errorToString(e.reason));
});
</script>
</body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Diagnostics</title>
<style>body{font-family:system-ui;background:#111;color:#fff;padding:16px}pre{white-space:pre-wrap;background:#222;padding:12px;border-radius:10px}button{padding:12px 16px;border:0;border-radius:999px;font-weight:700}a{color:#9cf}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script></head><body>
<p><a href="index.html">← Back</a></p><h1>Diagnostics</h1><button id="run">Run Diagnostics</button><pre id="out">Waiting...</pre>
<script type="module">
const out=document.getElementById('out');
function log(x){out.textContent += '\n' + x;}
function stringifyError(err){try{return JSON.stringify({name:err?.name,message:err?.message,stack:err?.stack,string:String(err)}, null, 2);}catch(e){return String(err);}}
document.getElementById('run').addEventListener('click', async()=>{
  out.textContent='Running...';
  const video=document.createElement('video');
  log('URL: '+location.href);
  log('Secure context: '+window.isSecureContext);
  log('mediaDevices: '+!!navigator.mediaDevices);
  log('getUserMedia: '+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
  log('canPlayType video/webm: '+video.canPlayType('video/webm'));
  log('canPlayType video/webm; codecs=vp9: '+video.canPlayType('video/webm; codecs="vp9"'));
  log('canPlayType video/webm; codecs=vp8: '+video.canPlayType('video/webm; codecs="vp8"'));
  try{
    const three=await import('three'); log('Three imported: '+!!three);
    const css3d=await import('three/addons/renderers/CSS3DRenderer.js'); log('CSS3DRenderer imported: '+!!css3d);
    const mindar=await import('mindar-image-three'); log('MindAR module keys: '+Object.keys(mindar).join(', '));
    log('MindARThree is function: '+(typeof mindar.MindARThree));
  }catch(err){log('Import failed:\n'+stringifyError(err));}
  for (const url of ['./targets.mind','./assets/poster-opening-frame_v01.png','./assets/animation_v01.webm']) {
    try{const res=await fetch(url,{cache:'no-store'}); const blob=await res.blob(); log(url+' -> '+res.status+' '+blob.size+' bytes');}
    catch(err){log(url+' failed: '+stringifyError(err));}
  }
});
</script></body></html>
